[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
addopts = "-q --strict-markers"
filterwarnings = [
    # LangChain deprecates aggressively across minor versions; the pinned
    # versions are known-good, so these are noise rather than signal.
    "ignore::DeprecationWarning",
    "ignore::PendingDeprecationWarning",
]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B"]
ignore = [
    "E501",  # long lines are handled by the formatter, not worth failing CI
    "B008",  # Streamlit idiom: calls in default position are fine here
]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["B011"]

[tool.coverage.run]
source = ["src"]
omit = ["*/tests/*"]
